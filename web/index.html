<!doctype html>
<!-- The static markup below is written in Chinese because that is the default
     for a first run. app.js repaints everything from i18n.js the moment it
     loads, so this only decides what the very first frame looks like — and a
     flash of English before the repaint is exactly what it avoids. -->
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心情夥伴</title>
<meta name="theme-color" content="#f5eefa">
<!-- iOS only honours the manifest's display:standalone from 16.4 on. These
     legacy meta tags are what older iPhones read, and newer ones ignore. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moodmate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/appicon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">

  <!-- ── Today ───────────────────────────────────────────────── -->
  <section class="screen" id="screen-today" data-screen="today">
    <header class="topbar">
      <div>
        <h1 id="entry-title">今日</h1>
        <div class="date-row">
          <input type="date" id="entry-date" aria-label="Entry date">
          <button class="ghost small" id="jump-today" data-i18n="jumpToday" hidden>返回今日</button>
        </div>
      </div>
      <div class="header-right">
        <div class="seg" id="lang-toggle">
          <button data-lang="en">EN</button><button data-lang="zh" class="on">中</button>
        </div>
      <div class="streak" id="streak" title="Day streak">
        <span class="flame">✿</span><span id="streak-count">0</span>
      </div>
      </div>
    </header>

    <div class="stage">
      <div class="char" id="char"></div>
    </div>

    <div class="picker" id="picker" role="radiogroup" aria-label="How are you feeling?"></div>

    <label class="note-label" for="note" data-i18n="noteLabel">有什麼想記低嗎？</label>
    <textarea id="note" rows="3" data-i18n-ph="notePlaceholder" placeholder="今日我…"></textarea>

    <p class="note-label spaced" data-i18n="photos">相片</p>
    <div class="photo-row" id="photos-today"></div>
    <input type="file" id="photo-input" accept="image/*" multiple hidden>

    <p class="note-label spaced" data-i18n="tagsLabel">今日做咗啲乜？</p>
    <div id="tags-today"></div>

    <button class="primary" id="save">儲存記錄</button>
    <p class="saved-hint" id="saved-hint" data-i18n="saved" hidden>已儲存 ✓</p>
    <button class="ghost danger block" id="delete-today" data-i18n="deleteEntry" hidden>刪除呢條記錄</button>
    <div class="confirm-row" id="confirm-delete" hidden>
      <span data-i18n="confirmDelete">確定刪除呢條記錄？此操作無法復原。</span>
      <button class="ghost danger" id="confirm-yes" data-i18n="del">刪除</button>
      <button class="ghost" id="confirm-no" data-i18n="keep">保留</button>
    </div>
  </section>

  <!-- ── History ─────────────────────────────────────────────── -->
  <section class="screen" id="screen-history" data-screen="history" hidden>
    <header class="topbar">
      <h1 data-i18n="history">月曆</h1>
      <div class="month-nav">
        <button id="prev-month" aria-label="Previous month">‹</button>
        <span id="month-label"></span>
        <button id="next-month" aria-label="Next month">›</button>
      </div>
    </header>
    <div class="tagrow filter" id="tag-filter" hidden></div>
    <div class="weekdays" id="weekdays"></div>
    <div class="calendar" id="calendar"></div>
    <div class="entry-detail" id="entry-detail" hidden></div>
    <div class="stats" id="stats"></div>
    <section class="tag-stats" id="tag-stats" hidden></section>
  </section>

  <!-- ── Entry list ──────────────────────────────────────────── -->
  <section class="screen" id="screen-list" data-screen="list" hidden>
    <header class="topbar">
      <h1 data-i18n="entryList">記錄</h1>
    </header>
    <div id="entry-list"></div>
  </section>

  <!-- ── Manage tags ─────────────────────────────────────────── -->
  <section class="screen" id="screen-tags" data-screen="tags" hidden>
    <header class="topbar">
      <div>
        <h1 data-i18n="tags">標籤</h1>
        <p class="date" data-i18n="tagsHint">封存唔會影響過往記錄</p>
      </div>
      <button class="ghost small" id="tags-back" data-i18n="done">完成</button>
    </header>

    <div class="new-tag">
      <input id="new-tag-icon" class="icon-input" placeholder="✨" maxlength="4" aria-label="Emoji">
      <input id="new-tag-label" class="name-input" data-i18n-ph="newTag" placeholder="新標籤" aria-label="Tag name">
      <select id="new-tag-group" aria-label="Group">
        <option value="life" data-i18n="groupLife">生活</option>
        <option value="social" data-i18n="groupSocial">社交</option>
        <option value="health" data-i18n="groupHealth">健康</option>
        <option value="leisure" data-i18n="groupLeisure">休閒</option>
      </select>
      <button class="ghost small primary-ghost" id="add-tag" data-i18n="add">新增</button>
    </div>

    <div id="tag-manage"></div>
  </section>

  <!-- ── Closet ──────────────────────────────────────────────── -->
  <section class="screen" id="screen-closet" data-screen="closet" hidden>
    <header class="topbar">
      <h1 data-i18n="closet">衣櫥</h1>
      <p class="date" id="closet-progress"></p>
    </header>
    <div class="stage stage-sm">
      <div class="char" id="char-closet"></div>
    </div>
    <div class="slot">
      <h2 data-i18n="character">角色</h2>
      <div class="grid char-grid" id="char-picker"></div>
    </div>
    <div id="slots"></div>
  </section>

</main>

<nav class="tabs" id="tabs">
  <button data-goto="today" class="active"><span>✎</span><i data-i18n="today">今日</i></button>
  <button data-goto="list"><span>☰</span><i data-i18n="entryList">記錄</i></button>
  <button data-goto="history"><span>▦</span><i data-i18n="history">月曆</i></button>
  <button data-goto="closet"><span>✿</span><i data-i18n="closet">衣櫥</i></button>
</nav>

<div class="lightbox" id="lightbox" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
